
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamesUZ | O‘yinlar olami</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#090d1c;color:white}
header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:#111831;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:bold;color:#65a5ff}
button{border:0;padding:11px 16px;border-radius:9px;background:#3478f6;color:white;cursor:pointer;font-weight:bold;margin:3px}
button:hover{opacity:.85}
input,select{padding:12px;border-radius:8px;border:1px solid #34415f;background:#17213b;color:white;width:100%;margin:7px 0}
main{padding:25px 5%}
.hero{padding:35px 20px;background:linear-gradient(120deg,#182b58,#472c83);border-radius:18px;margin-bottom:25px}
.hero h1{font-size:32px;margin-bottom:10px}
.search{max-width:500px;margin:20px 0}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.game{background:#151e35;border:1px solid #293653;border-radius:14px;overflow:hidden}
.cover{height:125px;background:linear-gradient(135deg,#284b91,#633e9b);display:flex;align-items:center;justify-content:center;font-size:42px}
.game-info{padding:14px}
.game-info h3{margin-bottom:8px}
.game-info p{color:#aab6d0;font-size:13px}
.game-info button{width:100%;margin:10px 0 0}
.panel{display:none;background:#151e35;border:1px solid #34415f;padding:18px;border-radius:14px;margin:20px 0}
.panel h2{margin-bottom:12px}
#status{font-size:13px;color:#9fb7e9;margin-top:10px}
footer{text-align:center;padding:30px;color:#8290ae}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">🎮 GamesUZ</div>
  <div>
    <button id="loginBtn" onclick="googleLogin()">Google orqali kirish</button>
    <button id="adminBtn" class="hidden" onclick="toggleAdmin()">Admin</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">Chiqish</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>GamesUZ olamiga xush kelibsiz!</h1>
    <p>Eng qiziqarli o‘yinlar bir joyda.</p>
  </section>

  <input class="search" id="search" placeholder="🔎 O‘yin qidirish..." oninput="renderGames()">

  <div class="categories">
    <button onclick="setCategory('Barchasi')">Barchasi</button>
    <button onclick="setCategory('Poyga')">Poyga</button>
    <button onclick="setCategory('Sarguzasht')">Sarguzasht</button>
    <button onclick="setCategory('Sport')">Sport</button>
  </div>

  <section id="adminPanel" class="panel">
    <h2>🛠 Admin panel</h2>
    <input id="gameName" placeholder="O‘yin nomi">
    <select id="gameCategory">
      <option>Poyga</option>
      <option>Sarguzasht</option>
      <option>Sport</option>
      <option>Boshqa</option>
    </select>
    <input id="gameUrl" placeholder="O‘yin havolasi (https://...)">
    <button onclick="saveGame()">O‘yinni saqlash</button>
    <button onclick="cancelEdit()" style="background:#59647c">Tozalash</button>
    <p id="status"></p>
  </section>

  <h2 style="margin-bottom:18px">🔥 O‘yinlar katalogi</h2>
  <section class="games" id="games">
    <p>O‘yinlar yuklanmoqda...</p>
  </section>
</main>

<footer>© 2026 GamesUZ. Barcha huquqlar himoyalangan.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth, GoogleAuthProvider, signInWithRedirect,
 getRedirectResult, onAuthStateChanged, signOut,
 signInWithEmailAndPassword, createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore, collection, addDoc, onSnapshot,
 doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCTVxXujxO9hQezvMu3_prvw9VudtTK8G4",
 authDomain: "gameuz.firebaseapp.com",
 projectId: "gameuz",
 storageBucket: "gameuz.firebasestorage.app",
 messagingSenderId: "267022267746",
 appId: "1:267022267746:web:ef87389fa1c764a3a6a83b",
 measurementId: "G-73GWY72GE1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ADMIN_UID = "DXEza5I4zsXE3PpgKxfr9NUDMGw2";

let games = [];
let category = "Barchasi";
let editingId = null;
let isAdmin = false;

window.googleLogin = async () => {
 try {
  await signInWithRedirect(auth, provider);
 } catch(error) {
  alert("Google orqali kirishda xato: " + error.message);
 }
};

getRedirectResult(auth).catch(error => {
 document.getElementById("status").textContent =
 "Kirish xatosi: " + error.message;
});

onAuthStateChanged(auth, user => {
 const loggedIn = !!user;
 isAdmin = loggedIn && user.uid === ADMIN_UID;

 document.getElementById("loginBtn").classList.toggle("hidden", loggedIn);
 document.getElementById("logoutBtn").classList.toggle("hidden", !loggedIn);
 document.getElementById("adminBtn").classList.toggle("hidden", !isAdmin);

 if(!isAdmin){
  document.getElementById("adminPanel").style.display = "none";
 }
});

window.logout = async () => {
 await signOut(auth);
 document.getElementById("adminPanel").style.display = "none";
};

window.toggleAdmin = () => {
 if(!isAdmin) return;
 const panel = document.getElementById("adminPanel");
 panel.style.display = panel.style.display === "block" ? "none" : "block";
};

onSnapshot(collection(db,"games"), snapshot => {
 games = snapshot.docs.map(d => ({id:d.id,...d.data()}));
 renderGames();
}, error => {
 document.getElementById("games").innerHTML =
 "<p>O‘yinlarni yuklashda xato: " + error.message + "</p>";
});

window.setCategory = value => {
 category = value;
 renderGames();
};

window.renderGames = () => {
 const search = document.getElementById("search").value.toLowerCase();
 const list = games.filter(g =>
  (category === "Barchasi" || g.category === category) &&
  (g.name || "").toLowerCase().includes(search)
 );

 const container = document.getElementById("games");

 if(!list.length){
  container.innerHTML = "<p>Hozircha o‘yin topilmadi.</p>";
  return;
 }

 container.innerHTML = "";

 list.forEach(g => {
  const card = document.createElement("article");
  card.className = "game";

  const cover = document.createElement("div");
  cover.className = "cover";
  cover.textContent = "🎮";

  const info = document.createElement("div");
  info.className = "game-info";

  const title = document.createElement("h3");
  title.textContent = g.name || "Nomsiz o‘yin";

  const cat = document.createElement("p");
  cat.textContent = g.category || "Boshqa";

  const play = document.createElement("button");
  play.textContent = "▶ O‘ynash";
  play.onclick = () => {
   if(g.gameUrl) window.open(g.gameUrl,"_blank","noopener");
   else alert("Bu o‘yinga havola qo‘shilmagan.");
  };

  info.append(title,cat,play);

  if(isAdmin){
   const edit = document.createElement("button");
   edit.textContent = "✏️ Tahrirlash";
   edit.style.background = "#6a56bb";
   edit.onclick = () => editGame(g.id);

   const del = document.createElement("button");
   del.textContent = "🗑 O‘chirish";
   del.style.background = "#bd4050";
   del.onclick = () => removeGame(g.id);

   info.append(edit,del);
  }

  card.append(cover,info);
  container.append(card);
 });
};

window.saveGame = async () => {
 if(!isAdmin) return alert("Siz admin emassiz.");

 const name = document.getElementById("gameName").value.trim();
 const cat = document.getElementById("gameCategory").value;
 const url = document.getElementById("gameUrl").value.trim();
 const status = document.getElementById("status");

 if(!name || !url){
  status.textContent = "O‘yin nomi va havolasini kiriting.";
  return;
 }

 try {
  new URL(url);
  if(editingId){
   await updateDoc(doc(db,"games",editingId),{
    name,category:cat,gameUrl:url
   });
   status.textContent = "O‘yin yangilandi!";
  } else {
   await addDoc(collection(db,"games"),{
    name,category:cat,gameUrl:url
   });
   status.textContent = "Yangi o‘yin qo‘shildi!";
  }
  cancelEdit();
 } catch(error) {
  status.textContent = "Xato: " + error.message;
 }
};

window.editGame = id => {
 if(!isAdmin) return;
 const g = games.find(x => x.id === id);
 if(!g) return;

 editingId = id;
 document.getElementById("gameName").value = g.name || "";
 document.getElementById("gameCategory").value = g.category || "Boshqa";
 document.getElementById("gameUrl").value = g.gameUrl || "";
 document.getElementById("adminPanel").style.display = "block";
 document.getElementById("status").textContent = "O‘yinni tahrirlayapsiz.";
};

window.cancelEdit = () => {
 editingId = null;
 document.getElementById("gameName").value = "";
 document.getElementById("gameUrl").value = "";
 document.getElementById("status").textContent = "";
};

window.removeGame = async id => {
 if(!isAdmin) return;
 if(!confirm("Bu o‘yinni o‘chirmoqchimisiz?")) return;
 try {
  await deleteDoc(doc(db,"games",id));
 } catch(error) {
  alert("O‘chirishda xato: " + error.message);
 }
};
</script>
</body>
</html>
